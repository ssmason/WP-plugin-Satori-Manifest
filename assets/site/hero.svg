<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="sm-hero-title">
	<title id="sm-hero-title">A QR code on a table card opening a price list on a phone</title>
	<defs>
		<linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#eef0ff"/>
			<stop offset="1" stop-color="#fdf2ec"/>
		</linearGradient>
		<filter id="sm-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1f2340" flood-opacity=".22"/>
		</filter>
	</defs>
	<circle cx="270" cy="250" r="230" fill="url(#sm-bg)"/>

	<!-- Table card with QR code -->
	<g filter="url(#sm-shadow)" transform="rotate(-8 140 330)">
		<rect x="40" y="220" width="190" height="230" rx="18" fill="#fff"/>
		<text x="135" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1f2340">Scan for prices</text>
		<g transform="translate(75 280)" fill="#1f2340">
			<rect width="120" height="120" rx="8" fill="#fff" stroke="#1f2340" stroke-width="4"/>
			<rect x="12" y="12" width="32" height="32" rx="4"/>
			<rect x="76" y="12" width="32" height="32" rx="4"/>
			<rect x="12" y="76" width="32" height="32" rx="4"/>
			<rect x="19" y="19" width="18" height="18" rx="2" fill="#fff"/>
			<rect x="83" y="19" width="18" height="18" rx="2" fill="#fff"/>
			<rect x="19" y="83" width="18" height="18" rx="2" fill="#fff"/>
			<rect x="54" y="14" width="10" height="10"/>
			<rect x="54" y="34" width="10" height="10"/>
			<rect x="54" y="56" width="10" height="10"/>
			<rect x="14" y="56" width="10" height="10"/>
			<rect x="34" y="56" width="10" height="10"/>
			<rect x="76" y="56" width="10" height="10"/>
			<rect x="98" y="56" width="10" height="10"/>
			<rect x="56" y="78" width="10" height="10"/>
			<rect x="78" y="78" width="10" height="10"/>
			<rect x="98" y="88" width="10" height="10"/>
			<rect x="66" y="98" width="10" height="10"/>
			<rect x="86" y="100" width="10" height="10"/>
		</g>
		<text x="135" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#8a8fa3">TABLE 4</text>
	</g>

	<!-- Phone -->
	<g filter="url(#sm-shadow)">
		<rect x="262" y="60" width="206" height="400" rx="34" fill="#1f2340"/>
		<rect x="274" y="72" width="182" height="376" rx="24" fill="#faf6f1"/>
		<rect x="335" y="80" width="60" height="8" rx="4" fill="#1f2340"/>
		<text x="365" y="126" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#2e2621">Willow &amp; Rose</text>
		<text x="365" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#8c7e72">HAIR · COLOUR · CARE</text>
		<line x1="292" y1="172" x2="330" y2="172" stroke="#d9cfc4"/>
		<line x1="400" y1="172" x2="438" y2="172" stroke="#d9cfc4"/>
		<text x="365" y="176" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#a0704c">Cutting</text>
		<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2e2621">
			<text x="292" y="206">Restyle</text><text x="438" y="206" text-anchor="end" fill="#a0704c">£68</text>
			<line x1="334" y1="203" x2="414" y2="203" stroke="#cbbfb3" stroke-dasharray="1.5 3"/>
			<text x="292" y="232">Cut &amp; finish</text><text x="438" y="232" text-anchor="end" fill="#a0704c">£58</text>
			<line x1="358" y1="229" x2="414" y2="229" stroke="#cbbfb3" stroke-dasharray="1.5 3"/>
			<text x="292" y="258">Blow dry</text><text x="438" y="258" text-anchor="end" fill="#a0704c">£32</text>
			<line x1="342" y1="255" x2="414" y2="255" stroke="#cbbfb3" stroke-dasharray="1.5 3"/>
		</g>
		<line x1="292" y1="292" x2="333" y2="292" stroke="#d9cfc4"/>
		<line x1="397" y1="292" x2="438" y2="292" stroke="#d9cfc4"/>
		<text x="365" y="296" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#a0704c">Colour</text>
		<g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2e2621">
			<text x="292" y="326">Balayage</text><text x="438" y="326" text-anchor="end" fill="#a0704c">£145</text>
			<line x1="344" y1="323" x2="410" y2="323" stroke="#cbbfb3" stroke-dasharray="1.5 3"/>
			<text x="292" y="352">Root tint</text><text x="438" y="352" text-anchor="end" fill="#a0704c">£55</text>
			<line x1="342" y1="349" x2="414" y2="349" stroke="#cbbfb3" stroke-dasharray="1.5 3"/>
			<text x="292" y="378">Toner</text><text x="438" y="378" text-anchor="end" fill="#a0704c">£25</text>
			<line x1="326" y1="375" x2="414" y2="375" stroke="#cbbfb3" stroke-dasharray="1.5 3"/>
		</g>
		<rect x="300" y="404" width="130" height="28" rx="14" fill="#a0704c"/>
		<text x="365" y="422" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fff">BOOK NOW</text>
	</g>

	<!-- Scan beam -->
	<path d="M222 300 C 245 290, 252 270, 268 262" fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
	<circle cx="268" cy="262" r="5" fill="#4f46e5"/>
</svg>
