# Sent to staff (Manifest → Settings → "Notify staff at") when a new application arrives.
# Placeholders: plan, billing, price, business_name, contact_name (first name), full_name, email, phone, website,
# business_type, design, message, review_url.

subject: "New application: {{business_name}}"
preheader: "{{full_name}} ({{email}}) has registered {{business_name}}."
heading: New application to review
body: |
  {{message}}
details: |
  Business: {{business_name}}
  Contact: {{full_name}}
  Email: {{email}}
  Phone: {{phone}}
  Website: {{website}}
  Type: {{business_type}}
  Plan: {{plan}}
  Billing: {{billing}} — {{price}}
  Preferred design: {{design}}
button_label: Review application
button_url: "{{review_url}}"
footer: Sent by {{site_name}}.
