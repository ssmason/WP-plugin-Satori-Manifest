# Sent to the applicant straight after they register.
# Placeholders: contact_name, business_name, plan, site_name, site_url, login_url, year.

subject: We've received your application, {{contact_name}}
preheader: Thanks for registering {{business_name}} — we'll be in touch shortly.
heading: Thanks for registering
body: |
  Hi {{contact_name}},

  Thanks for registering {{business_name}} with {{site_name}} on our {{plan}} plan. We review every application personally and will get back to you shortly.

  Once you're approved we'll email your login details, and your QR price list page will be ready to make your own.
footer: You're receiving this because you registered on {{site_name}}.
