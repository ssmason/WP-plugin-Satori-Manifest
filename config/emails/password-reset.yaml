# WordPress's "reset your password" email, in the portal's style.
# Placeholders: contact_name, username, reset_url.

subject: Reset your {{site_name}} password
preheader: Use the link inside to choose a new password.
heading: Reset your password
body: |
  Hi {{contact_name}},

  Someone asked to reset the password for {{username}}. If that was you, choose a new password with the button below.

  If you didn't ask for this, you can ignore this email — your password won't change.
button_label: Choose a new password
button_url: "{{reset_url}}"
footer: For your security this link only works once.
