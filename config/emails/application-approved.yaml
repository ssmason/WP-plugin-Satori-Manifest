# Sent to the applicant when their application is approved.
# Placeholders: contact_name, business_name, username, set_password_url, page_url, login_url.
# For security the password itself is never emailed — the link lets them set their own.

subject: You're approved — welcome to {{site_name}}
preheader: Your QR price list page for {{business_name}} is ready.
heading: Welcome aboard, {{contact_name}}
body: |
  Great news — {{business_name}} has been approved and your price list page is ready.

  Your username: {{username}}

  Use the button below to choose your password and log in. The link is valid for 24 hours; after that you can use "Lost your password?" on the login page.

  Your page lives at {{page_url}} — this is the address your QR code will open.
button_label: Set your password
button_url: "{{set_password_url}}"
footer: Log in any time at {{login_url}}
