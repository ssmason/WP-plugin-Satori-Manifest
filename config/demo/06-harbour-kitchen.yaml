# Demo client - the complete example. Studio design with every branding,
# header and footer setting filled in: logo, all six colours, both fonts, euro
# pricing after the number, sticky header, menu links that jump to sections
# (#starters …), a header button, full contact details, socials and a footer note,
# an icon beside each section title (Lucide icons, ISC licence) and a page
# with its own photos and the sections each price list shows.
#
# Photos (Wikimedia Commons, CC0 / public domain): grilled octopus rice (hero),
# garlic prawns, seafood paella, paella valenciana, wine glasses, Piran harbour.
# The price list shows section descriptions, badges, "from" prices and sub-headings.

user:
  login: harbourkitchen
  email: hola@harbourkitchen.test
  name: Harbour Kitchen
design: studio
brand:
  # Brand
  sm_brand_name: Harbour Kitchen
  sm_brand_tagline: Seafood & wine by the sea
  sm_brand_logo: assets/harbour-kitchen-logo.png
  sm_brand_logo_width: 120
  sm_currency_symbol: €
  sm_currency_position: after
  # Colours
  sm_colour_background: "#faf6ef"
  sm_colour_surface: "#f1e7d8"
  sm_colour_text: "#14283a"
  sm_colour_muted: "#5f6b78"
  sm_colour_accent: "#d9653b"
  sm_colour_accent_text: "#ffffff"
  # Fonts
  sm_font_heading: fraunces
  sm_font_body: manrope
  # Header
  sm_header_layout: split
  sm_header_show_nav: true
  sm_header_sticky: true
  sm_header_cta_label: Book a table
  sm_header_cta_url: "tel:+34952000000"
  # Footer - contact
  sm_footer_address: |-
    Paseo Marítimo 12
    29016 Málaga
  sm_footer_hours: |-
    Tue–Thu 12:30 – 23:00
    Fri–Sun 12:30 – midnight
    Monday closed
  sm_footer_phone: +34 952 000 000
  sm_footer_email: hola@harbourkitchen.test
  # Footer - social
  sm_social_website: https://harbourkitchen.test
  sm_social_instagram: https://instagram.com/harbourkitchen
  sm_social_facebook: https://facebook.com/harbourkitchen
  sm_social_tiktok: https://tiktok.com/@harbourkitchen
  # Footer - extras
  sm_footer_note: Please tell us about any allergies and our team will happily help. Prices include VAT.
  sm_footer_show_credit: true
menu:
  - { label: Starters, url: "#starters" }
  - { label: Mains, url: "#mains" }
  - { label: Desserts, url: "#desserts" }
  - { label: Drinks, url: "#drinks" }
sections:
  - title: Starters
    icon: assets/harbour-kitchen-salad.png
    description: Made to share, so order a few for the table.
    items:
      - { label: Pan con tomate, description: "Toasted sourdough, grated tomato, olive oil", price: 4.5 }
      - { label: Gambas al pil-pil, description: "Prawns, garlic, chilli, sizzling oil", price: 12, badge: Signature }
      - { label: Boquerones, description: "White anchovies in vinegar, parsley", price: 8 }
      - { label: Croquetas, description: "Jamón ibérico, four pieces", price: 7.5, badge: Popular }
      - { label: Padrón peppers, description: "Blistered, sea salt", price: 6, badge: Vegan }
  - title: Mains
    icon: assets/harbour-kitchen-fish.png
    description: Fish arrives every morning from the Málaga market.
    items:
      - { label: From the grill }
      - { label: Catch of the day, description: "Ask your server, priced by weight", price: 24, price_prefix: from }
      - { label: Grilled octopus, description: "Potato purée, smoked paprika", price: 22 }
      - { label: Ribeye steak, description: "300 g, chimichurri, fries", price: 28 }
      - { label: Rice dishes, description: "For two, allow 25 minutes" }
      - { label: Seafood paella, description: "Prawns, mussels, squid, saffron", price: 38, badge: For two }
      - { label: Black rice, description: "Cuttlefish ink, alioli", price: 34 }
      - { label: Vegetable paella, description: "Artichoke, peppers, green beans", price: 30, badge: Vegan }
  - title: Desserts
    icon: assets/harbour-kitchen-cake-slice.png
    items:
      - { label: Crema catalana, price: 6.5 }
      - { label: Basque cheesecake, description: "Burnt top, berry compote", price: 7, badge: New }
      - { label: Churros, description: "Hot chocolate for dipping", price: 6 }
  - title: Drinks
    icon: assets/harbour-kitchen-wine.png
    description: Wines by the glass from Andalusian vineyards.
    items:
      - { label: Wine }
      - { label: House white or red, description: "Glass", price: 4.5 }
      - { label: Fino sherry, description: "Glass, served chilled", price: 4 }
      - { label: Bottle of the week, description: "Ask for today's choice", price: 22, price_prefix: from }
      - { label: Beer & soft drinks }
      - { label: Draught beer, description: "Caña", price: 2.8 }
      - { label: Fresh orange juice, price: 4 }
      - { label: Coffee, price: 1.8 }

