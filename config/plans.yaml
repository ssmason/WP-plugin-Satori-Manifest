# Pricing plans offered on the registration form and charged through Stripe.
#
# currency   ISO 4217 code used for display and for Stripe (eur, gbp, usd…).
# trial_days Free days before the first payment (0 for none). The card is taken at
#            sign-up and Stripe charges it automatically when the trial ends.
# plans      Keyed by slug - the slug is stored on applications and subscriptions.
#   prices         Amount per billing interval, in whole currency units (12 = €12.00).
#                  Offer both "month" and "year" to show the Monthly / Yearly toggle.
#   codes          Standard printed QR codes included at sign-up (see printed-codes.yaml).
#   setup_included true when "we set it up for you" is part of the plan.
#   stripe_prices  Optional Stripe Price IDs (price_…) per interval. Leave empty to
#                  let the plugin create the price on the fly at checkout - no setup
#                  in the Stripe dashboard needed.
#
# Estimates (review before going live): hosting for every client page runs on one
# WordPress site (≈ €20–40 a month in total), Stripe takes ≈ 1.5% + €0.25 per EU card
# payment, and printed codes cost a few euros per client. Yearly = two months free.
#
# setup      Optional "we set it up for you" service, one-off, paid at sign-up (the free
#            trial covers the plan only). free_with_yearly: no charge on yearly billing.
#
# Override by copying this file to {theme}/satori-manifest/plans.yaml.

currency: eur
trial_days: 30

# Printed QR codes (sizes, prices, postage): see printed-codes.yaml.

setup:
  price: 39
  free_with_yearly: false

plans:
  self-managed:
    title: Starter
    tagline: Your own price list page, updated by you.
    codes: 1
    prices:
      month: 12
      year: 120
    stripe_prices:
      month: ""
      year: ""
    features:
      - One printed QR code, posted to you
      - Choice of nine professional designs
      - Your logo, colours, fonts and contact details
      - Update prices any time, from any device
      - Printable PDF price list and QR signs
      - Email support

  plus:
    title: Plus
    tagline: Update everything in seconds by chatting with AI.
    badge: Most popular
    codes: 3
    prices:
      month: 15
      year: 150
    stripe_prices:
      month: ""
      year: ""
    features:
      - Everything in Starter
      - AI assistant - change prices and menus by chat (ChatGPT or Claude)
      - Three printed QR codes, posted to you
      - Priority support
