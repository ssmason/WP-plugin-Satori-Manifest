# Font library offered in the Brand → Typography selects.
#
# family: CSS font-family stack.
# google: Google Fonts css2 family parameter (omit for system fonts).

system-sans:
  label: System sans-serif
  family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

system-serif:
  label: System serif
  family: "Georgia, 'Times New Roman', serif"

cormorant-garamond:
  label: Cormorant Garamond
  family: "'Cormorant Garamond', Georgia, serif"
  google: "Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400"

playfair-display:
  label: Playfair Display
  family: "'Playfair Display', Georgia, serif"
  google: "Playfair+Display:ital,wght@0,400;0,500;0,700;1,400"

dm-serif-display:
  label: DM Serif Display
  family: "'DM Serif Display', Georgia, serif"
  google: "DM+Serif+Display:ital@0;1"

fraunces:
  label: Fraunces
  family: "'Fraunces', Georgia, serif"
  google: "Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700"

jost:
  label: Jost
  family: "'Jost', sans-serif"
  google: "Jost:wght@300;400;500;600"

manrope:
  label: Manrope
  family: "'Manrope', sans-serif"
  google: "Manrope:wght@400;500;600;700;800"

montserrat:
  label: Montserrat
  family: "'Montserrat', sans-serif"
  google: "Montserrat:wght@300;400;500;600;700"

nunito:
  label: Nunito
  family: "'Nunito', sans-serif"
  google: "Nunito:wght@400;500;600;700;800"

dm-sans:
  label: DM Sans
  family: "'DM Sans', sans-serif"
  google: "DM+Sans:wght@300;400;500;700"

space-grotesk:
  label: Space Grotesk
  family: "'Space Grotesk', sans-serif"
  google: "Space+Grotesk:wght@400;500;600;700"

ibm-plex-mono:
  label: IBM Plex Mono
  family: "'IBM Plex Mono', ui-monospace, monospace"
  google: "IBM+Plex+Mono:wght@400;500;600"

bebas-neue:
  label: Bebas Neue
  family: "'Bebas Neue', Impact, sans-serif"
  google: "Bebas+Neue"
